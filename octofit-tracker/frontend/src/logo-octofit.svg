<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#ff6b6b" opacity="0.2"/>
  
  <!-- Dumbbell -->
  <g id="dumbbell">
    <!-- Left weight -->
    <rect x="15" y="42" width="12" height="16" rx="2" fill="#1e3a5f"/>
    <rect x="12" y="38" width="18" height="5" fill="#1e3a5f"/>
    <rect x="12" y="57" width="18" height="5" fill="#1e3a5f"/>
    
    <!-- Bar -->
    <rect x="27" y="47" width="46" height="6" rx="3" fill="#ff6b6b"/>
    
    <!-- Right weight -->
    <rect x="73" y="42" width="12" height="16" rx="2" fill="#1e3a5f"/>
    <rect x="70" y="38" width="18" height="5" fill="#1e3a5f"/>
    <rect x="70" y="57" width="18" height="5" fill="#1e3a5f"/>
  </g>
  
  <!-- Heartbeat line -->
  <polyline points="20,70 30,70 35,60 40,75 45,70 50,70 55,70 60,65 65,70 70,70" 
            stroke="#ffd700" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text -->
  <text x="50" y="90" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a5f" font-family="Arial, sans-serif">
    OctoFit
  </text>
</svg>
